<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Code Expert System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <nav class="top-nav glass-panel" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; margin: 20px auto; max-width: 900px; border-radius: 12px; z-index: 1000;">
        <div style="font-size: 1.2rem; font-weight: 700; color: var(--text-main);">CleanCode <span style="color: var(--primary);">System</span></div>
        <div style="display: flex; gap: 15px;">
            <a href="/" style="text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: 500; background: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);">Standard Analysis</a>
            <a href="/ai-dashboard" style="text-decoration: none; color: var(--text-main); padding: 8px 16px; border-radius: 8px; font-weight: 500; opacity: 0.7; transition: all 0.3s ease;">Advanced AI & Scoring</a>
        </div>
    </nav>

    <main class="container">
        <header class="glass-panel">
            <h1>Clean Code <span>Expert System</span></h1>
            <p>Automated JavaScript code analysis & refactoring recommendations</p>
        </header>

        <section class="input-section glass-panel">
            <div class="input-group">
                <input type="text" id="targetPath" placeholder="Enter absolute path to your JS file or project folder..." />
                <button id="analyzeBtn" class="btn-primary">
                    <span id="btnText">Analyze Code</span>
                    <div id="btnLoader" class="loader hidden"></div>
                </button>
            </div>
            <div id="errorMessage" class="error-msg hidden"></div>
        </section>

        <section id="resultsSection" class="results-section hidden">
            <div class="results-header glass-panel">
                <h2>Analysis Results</h2>
                <p id="scanSummary"></p>
            </div>
            
            <div id="cardsContainer" class="cards-container">
                <!-- Recommendations will be injected here by JS -->
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
